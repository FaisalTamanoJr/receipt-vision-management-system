[project]
name = "receipt-vision-management-system"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pyside6",
  "opencv-python-headless",
  "rapidocr-onnxruntime",
  "llama-cpp-python",
  "dateparser",
  "platformdirs",
  "sqlalchemy>=2.0",
  "alembic",
  "pillow",
  "google-genai",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
receipt-manager = "receipt_manager.ui.app:main"

# ship the HTML/CSS/JS pages with the package
[tool.setuptools.package-data]
"receipt_manager.ui" = ["web/*.html", "web/css/*", "web/js/*", "web/vendor/*"]
