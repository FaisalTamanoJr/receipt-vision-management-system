<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPECAPS - Home</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- qwebchannel.js is built into Qt WebEngine; it simply fails to load in a normal browser -->
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="js/common.js"></script>
  <script src="vendor/chart.umd.min.js"></script>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="topbar">
    <nav>
      <a href="home.html" aria-current="page">HOME</a>
      <a href="#receipts">RECEIPTS</a>
      <a href="#scan">SCAN</a>
    </nav>

    <div class="right">
      <button class="btn btn-signout" id="signOut">
        Sign Out 
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>

      <a href="settings.html" class="icon-btn" title="Settings" aria-label="Settings">
        <svg class="i gear-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </a>
    </div>
  </header>

  <!-- Main Home Content -->
  <div class="home">
    <main class="main">
      <h1>Welcome back<span id="name"></span>,</h1>
      <p class="sub">Manage your receipts efficiently and track financial performance.</p>

      <!-- Stat Cards -->
      <div class="stats">
        <div class="stat">
          <div class="ic">
            <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
            </svg>
          </div>
          <span>Total Receipts</span>
          <strong id="sTotal">–</strong>
        </div>

        <div class="stat">
          <div class="ic">
            <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
            </svg>
          </div>
          <span>This Month</span>
          <strong id="sMonth">–</strong>
        </div>

        <div class="stat">
          <div class="ic">
            <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
            </svg>
          </div>
          <span>Total Amount</span>
          <strong id="sAmount">–</strong>
        </div>

        <div class="stat">
          <div class="ic">
            <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
              <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
            </svg>
          </div>
          <span>Storage Used</span>
          <strong id="sStorage">–</strong>
        </div>
      </div>

      <!-- Side-by-Side Analytics Grid -->
      <div class="analytics-grid">
        <div class="chart-card">
          <div class="chart-header">
            <div>
              <h2>Monthly Sales Comparison</h2>
              <span class="badge-growth" id="growth" hidden></span>
            </div>
          </div>
          <div class="chart-container">
            <canvas id="salesChart"></canvas>
          </div>
        </div>

        <div class="chart-card">
          <div class="chart-header">
            <h2>Money & Revenue Projection</h2>
            <select class="chart-select" id="projMonths" aria-label="Projection length">
              <option value="12">Next 12 Months</option>
              <option value="6">Next 6 Months</option>
            </select>
          </div>
          <div class="chart-container">
            <canvas id="projectionChart"></canvas>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="js/home.js"></script>
</body>
</html>
